# Configuração das ferramentas de desenvolvimento. A versão do app fica em clack/__init__.py.

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Vem de dentro do sounddevice 0.5.6 (ver requirements-*.txt), não do Clack.
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]
